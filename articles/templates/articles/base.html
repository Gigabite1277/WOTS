<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WOTS - World Of The Stories{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #f5f5f0;
            color: #222;
            line-height: 1.6;
        }

        header {
            background-color: #1a1a2e;
            color: #fff;
            padding: 1rem 0;
            border-bottom: 4px solid #e94560;
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 a {
            color: #fff;
            text-decoration: none;
            font-size: 2rem;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
            font-weight: 900;
        }

        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 1.5rem;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
        }

        header nav a:hover { color: #e94560; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        main { padding: 2.5rem 0; }

        footer {
            background-color: #1a1a2e;
            color: #aaa;
            text-align: center;
            padding: 1.5rem 0;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            margin-top: 3rem;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{% url 'articles:homepage' %}">WOTS</a></h1>
            <nav>
                <a href="{% url 'articles:homepage' %}">Home</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 WOTS &mdash; World Of The Stories. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
